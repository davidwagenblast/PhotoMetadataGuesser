<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE6CC"/>
      <stop offset="0.55" stop-color="#FFC6C2"/>
      <stop offset="1" stop-color="#F49BBE"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ECDF6"/>
      <stop offset="1" stop-color="#DDF1FF"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFC24B"/>
    </linearGradient>
    <filter id="appShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7A3048" flood-opacity="0.30"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8A3A52" flood-opacity="0.28"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="292" y="292" width="356" height="356" rx="10"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#appShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="6"/>

  <!-- Sparkles -->
  <path d="M215 250 l11 28 28 11 -28 11 -11 28 -11 -28 -28 -11 28 -11z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M800 760 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="250" cy="790" r="9" fill="#FFFFFF" opacity="0.8"/>

  <!-- Instant photo -->
  <g transform="rotate(-8 470 530)" filter="url(#cardShadow)">
    <rect x="256" y="256" width="428" height="530" rx="28" fill="#FFFDF7"/>
    <g clip-path="url(#photoClip)">
      <rect x="292" y="292" width="356" height="356" fill="url(#sky)"/>
      <!-- cloud -->
      <g fill="#FFFFFF" opacity="0.95">
        <circle cx="560" cy="340" r="22"/><circle cx="588" cy="330" r="28"/><circle cx="617" cy="342" r="20"/>
        <rect x="540" y="340" width="96" height="22" rx="11"/>
      </g>
      <!-- smiling sun -->
      <circle cx="430" cy="440" r="80" fill="url(#sun)"/>
      <circle cx="403" cy="430" r="10" fill="#5A3328"/>
      <circle cx="457" cy="430" r="10" fill="#5A3328"/>
      <circle cx="406" cy="426" r="3.5" fill="#FFFFFF"/>
      <circle cx="460" cy="426" r="3.5" fill="#FFFFFF"/>
      <ellipse cx="383" cy="458" rx="15" ry="9" fill="#FF8FA3" opacity="0.85"/>
      <ellipse cx="477" cy="458" rx="15" ry="9" fill="#FF8FA3" opacity="0.85"/>
      <path d="M414 458 Q430 476 446 458" fill="none" stroke="#5A3328" stroke-width="7" stroke-linecap="round"/>
      <!-- hills -->
      <path d="M292 560 Q 380 488 470 548 T 648 520 V 648 H 292 Z" fill="#9BD98E"/>
      <path d="M292 604 Q 410 540 520 596 T 648 586 V 648 H 292 Z" fill="#6DC47F"/>
    </g>
    <text x="470" y="738" font-family="Inter, 'Inter Display', sans-serif" font-weight="800" font-size="62"
          fill="#D9667F" text-anchor="middle" letter-spacing="4">19??</text>
  </g>

  <!-- Calendar badge -->
  <g transform="rotate(11 728 330)" filter="url(#cardShadow)">
    <rect x="618" y="222" width="222" height="222" rx="40" fill="#FFFFFF"/>
    <path d="M618 262 a40 40 0 0 1 40 -40 h142 a40 40 0 0 1 40 40 v38 h-222 z" fill="#EF6F6A"/>
    <rect x="668" y="200" width="20" height="54" rx="10" fill="#8C4A5A"/>
    <rect x="770" y="200" width="20" height="54" rx="10" fill="#8C4A5A"/>
    <text x="729" y="420" font-family="Inter, 'Inter Display', sans-serif" font-weight="900" font-size="124"
          fill="#EF6F6A" text-anchor="middle">?</text>
  </g>
</svg>
