name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  swiftpm:
    name: Test & build app (SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests (estimation logic)
        run: swift test
      - name: Build app bundle (one-step script)
        run: ./"Build Photo Date Guesser.command"
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Photo Date Guesser.app" PhotoDateGuesser.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDateGuesser-app
          path: build/PhotoDateGuesser.zip

  xcode:
    name: Build Xcode project (XcodeGen)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -project PhotoMetadataGuesser.xcodeproj -scheme PhotoMetadataGuesser -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

  installer:
    name: One-line installer
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh (builds this branch from GitHub)
        run: PDG_BRANCH="${{ github.ref_name }}" PDG_NO_OPEN=1 bash install.sh
      - name: Check the installed app
        run: codesign --verify --verbose=1 "/Applications/Photo Date Guesser.app"

  command-line-tools:
    name: Build with only the Command Line Tools (newest macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Switch to the Command Line Tools
        run: |
          if [ ! -d /Library/Developer/CommandLineTools/usr/bin ]; then
            echo "::error::Command Line Tools are not installed on this runner image"; exit 1
          fi
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          xcode-select -p
          sw_vers
          swift --version
      - name: Build app bundle
        # Setting DEVELOPER_DIR stops the build script from switching to Xcode.
        env:
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
        run: ./scripts/build-app.sh
      - name: Check the app
        run: codesign --verify --verbose=1 "build/Photo Date Guesser.app"
